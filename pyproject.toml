[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-simulation-regression-analyzer"
version = "0.1.0"
description = "A small RTL simulation runner and performance regression analyzer"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
simreg = "simreg.cli:main"

[tool.setuptools.packages.find]
include = ["simreg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
